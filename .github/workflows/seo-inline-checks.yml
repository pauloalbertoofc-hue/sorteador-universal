name: SEO landing pages and ads regression
on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/seo-inline-tools.test.mjs'
      - '.github/workflows/seo-inline-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Check SEO embed, room UI and ad placement contracts
        run: node --test tests/seo-inline-tools.test.mjs
