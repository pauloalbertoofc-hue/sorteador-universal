name: Secret Santa mobile browser integration
on:
  pull_request:
    paths:
      - 'public/amigo-secreto/**'
      - 'src/secret-santa.js'
      - 'tests/secret-santa-mobile-browser.test.mjs'
      - '.github/workflows/secret-santa-mobile-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise two mobile clients and isolated D1
        run: node --test tests/secret-santa-mobile-browser.test.mjs
