name: Dependency security audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Audit dependency tree without modifying lockfile
        shell: bash
        run: |
          npm audit --json > dependency-audit.json || true
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('dependency-audit.json','utf8'));
          if(report.error)throw Error('npm audit could not complete: '+(report.error.summary||report.error.code));
          const findings=Object.entries(report.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url})}));
          const counts=report.metadata?.vulnerabilities||{};
          const lines=['# Dependency audit','', 'Counts: '+JSON.stringify(counts),'',...findings.map(x=>'- **'+x.name+'** ('+x.severity+', '+(x.isDirect?'direct':'transitive')+'): '+JSON.stringify({range:x.range,fixAvailable:x.fixAvailable,via:x.via}))];
          writeFileSync('dependency-audit-summary.md',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          if((counts.high||0)+(counts.critical||0)>0)throw Error('High/critical vulnerabilities require review before production release');
          NODE
      - name: Upload audit report (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit-summary.md
          if-no-files-found: ignore
          retention-days: 7
