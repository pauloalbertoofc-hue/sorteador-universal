name: Production rooms v2.6 deploy (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLICAR-SALAS-V26 after the v2.6 production migration and browser tests pass'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sorteador-universal-production-rooms-release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'PUBLICAR-SALAS-V26' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Check syntax and production target
        run: |
          npm run check
          node scripts/verify-production-room-migration.mjs
      - name: Install Chromium for independent mobile-client validation
        run: npx playwright install --with-deps chromium
      - name: Run isolated room integration tests
        run: node --test --test-concurrency=1 tests/rooms-api-contract.test.mjs tests/rooms-integration.test.mjs tests/rooms-multiclient-browser.test.mjs
      - name: Require completed room migration before deploy (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('draw_rooms','draw_room_entries','draw_room_events','draw_room_rate_limits') ORDER BY name;" --json > rooms.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM d1_migrations ORDER BY id;" --json > history.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const rows=file=>JSON.parse(readFileSync(file,'utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          const tables=rows('rooms.json');
          const required=['draw_room_entries','draw_room_events','draw_room_rate_limits','draw_rooms'];
          if(JSON.stringify(tables)!==JSON.stringify(required))throw Error('Room tables not fully present; deployment blocked');
          const history=rows('history.json');
          for(const name of ['0003_public_rooms.sql','0004_room_rate_limits.sql','0005_room_live_draw.sql','0006_room_draw_mode.sql'])if(!history.includes(name))throw Error('Room migration not recorded: '+name);
          console.log('Production D1 rooms migration verified; no user data read.');
          NODE
      - name: Deploy worker and static assets (existing production secrets preserved)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify public app responds (read-only)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 2 https://sorteador-universal.paulo-alberto-ofc.workers.dev/ -o /dev/null
          echo 'Production homepage responded; manual room smoke test still required.'
