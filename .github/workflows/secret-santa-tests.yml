name: Secret Santa engine tests

on:
  pull_request:
    paths:
      - 'public/amigo-secreto/**'
      - 'src/secret-santa.js'
      - 'src/worker.js'
      - 'migrations/*secret_santa*'
      - 'tests/secret-santa-*.test.mjs'
      - '.github/workflows/secret-santa-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-secret-santa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Test secret santa engine
        run: node --check src/secret-santa.js && node --check src/worker.js && node --test tests/secret-santa-*.test.mjs
