name: Apply Secret Santa D1 migration 0007 (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APLICAR-MIGRACAO-0007 to authorize production D1 migration'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sorteador-universal-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APLICAR-MIGRACAO-0007' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Verify expected migration file and production target
        run: |
          set -euo pipefail
          test -f migrations/0007_secret_santa_private_storage.sql
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const db=cfg.d1_databases?.find(x=>x.binding==='DB');
          if(db?.database_name!=='sorteador-universal-db' || db?.database_id!=='24fe67dc-7003-4557-9de0-cf6658e713c2')throw Error('Unexpected production D1 target');
          console.log('Production target verified');
          NODE
      - name: Apply only migration 0007 to production D1 and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM d1_migrations ORDER BY id;" --json > history-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names=JSON.parse(fs.readFileSync('history-before.json','utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          for(const name of ['0003_public_rooms.sql','0004_room_rate_limits.sql','0005_room_live_draw.sql','0006_room_draw_mode.sql'])if(!names.includes(name))throw Error('Prerequisite migration missing: '+name);
          if(names.includes('0007_secret_santa_private_storage.sql'))throw Error('0007 already recorded; refusing duplicate application');
          console.log('Prerequisites verified; migration 0007 pending');
          NODE
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('secret_santa_events','secret_santa_participants') ORDER BY name;" --json > tables-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names=JSON.parse(fs.readFileSync('tables-before.json','utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          if(names.length)throw Error('Some Secret Santa tables already exist; manual review required');
          console.log('No pre-existing Secret Santa tables');
          NODE
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('secret_santa_events','secret_santa_participants') ORDER BY name;" --json > tables-after.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM d1_migrations WHERE name='0007_secret_santa_private_storage.sql';" --json > history-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names=f=>JSON.parse(fs.readFileSync(f,'utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          if(JSON.stringify(names('tables-after.json'))!==JSON.stringify(['secret_santa_events','secret_santa_participants']))throw Error('Post-migration tables mismatch');
          if(!names('history-after.json').includes('0007_secret_santa_private_storage.sql'))throw Error('0007 not recorded');
          console.log('SUCCESS: Secret Santa tables and migration history verified in production D1');
          NODE
