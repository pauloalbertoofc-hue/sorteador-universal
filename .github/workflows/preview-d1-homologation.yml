name: Preview D1 homologation (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_preview_database:
        description: 'Type HOMOLOGAR-PREVIEW to apply migrations ONLY to the preview D1 database'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview-migrations:
    if: ${{ inputs.confirm_preview_database == 'HOMOLOGAR-PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact preview database target
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.preview-db.jsonc','utf8'));
          const db=config.d1_databases;
          if(db.length!==1||db[0].binding!=='DB'||db[0].database_id!=='9701cfcf-9c77-4b09-8411-0f4a13f8c584'||db[0].database_name!=='sorteador-universal-preview-db'||db[0].migrations_dir!=='migrations/preview')throw Error('Unexpected D1 target: refusing remote migration');
          const production='24fe67dc-7003-4557-9de0-cf6658e713c2';
          if(JSON.stringify(config).includes(production))throw Error('Production database identifier found in preview config');
          console.log('Target verified: isolated preview D1 database');
          NODE
      - name: Run isolated D1 integration tests first
        run: node --test tests/preview.test.mjs tests/rooms-integration.test.mjs
      - name: Apply preview-only migrations (explicit manual approval)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npm run db:preview:remote
      - name: Verify preview migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list DB --remote --config wrangler.preview-db.jsonc
      - name: Read-only verification of preview room tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.preview-db.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('draw_rooms','draw_room_entries','draw_room_rate_limits') ORDER BY name;" --json > preview-tables.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const output=JSON.parse(readFileSync('preview-tables.json','utf8'));
          const names=output.flatMap(x=>x.results||[]).map(x=>x.name).sort();
          const expected=['draw_room_entries','draw_room_rate_limits','draw_rooms'];
          if(JSON.stringify(names)!==JSON.stringify(expected))throw Error('Preview D1 room tables missing: '+JSON.stringify(names));
          console.log('Preview D1 room tables verified');
          NODE
