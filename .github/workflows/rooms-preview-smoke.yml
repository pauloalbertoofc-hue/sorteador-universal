name: Rooms preview HTTP smoke (manual, no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing isolated preview Worker over HTTPS
        run: node scripts/preview-rooms-smoke.mjs
