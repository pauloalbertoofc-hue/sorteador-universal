name: Billing checkout validation
on:
  pull_request:
    paths:
      - 'src/billing.js'
      - 'tests/billing-checkout-validation.test.mjs'
      - '.github/workflows/billing-checkout-validation.yml'
  workflow_dispatch:
jobs:
  billing-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/billing-checkout-validation.test.mjs
