name: Billing pilot gate
on:
  pull_request:
    paths:
      - 'src/billing.js'
      - 'src/worker.js'
      - 'tests/billing-pilot.test.mjs'
      - '.github/workflows/billing-pilot.yml'
  workflow_dispatch:
jobs:
  pilot-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/billing-pilot.test.mjs
