name: Secret Santa release checks

on:
  pull_request:
    paths:
      - 'public/index.html'
      - 'public/amigo-secreto/**'
      - 'public/sitemap.xml'
      - 'src/secret-santa.js'
      - 'tests/secret-santa*.test.mjs'
      - '.github/workflows/secret-santa-release-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Verify app syntax
        run: |
          npm run check
          node --check public/amigo-secreto/app.mjs
          node --check public/amigo-secreto/engine.mjs
      - name: Install Playwright Chromium for browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Run Secret Santa unit and private API tests
        run: node --test --test-concurrency=1 tests/secret-santa*.test.mjs
      - name: Check homepage integration and SEO release readiness
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const home=fs.readFileSync('public/index.html','utf8');
          const page=fs.readFileSync('public/amigo-secreto/index.html','utf8');
          const sitemap=fs.readFileSync('public/sitemap.xml','utf8');
          assert.match(home, /href="\/amigo-secreto\/"/);
          assert.match(page, /rel="canonical" href="https:\/\/sorteador\.shadownink\.com\/amigo-secreto\/"/);
          assert.match(page, /name="description"/);
          assert.doesNotMatch(page, /noindex|nofollow/i);
          assert.match(page, /name="referrer" content="no-referrer"/);
          assert.match(sitemap, /https:\/\/sorteador\.shadownink\.com\/amigo-secreto\//);
          console.log('Homepage link, canonical, metadata, privacy header and sitemap verified.');
          NODE
      - name: Confirm no deployment occurred
        run: echo "Checks only; no remote D1 changes, no deploy and no indexing request."
