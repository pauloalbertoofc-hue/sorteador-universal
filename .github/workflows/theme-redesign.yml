name: Theme redesign contracts
on:
  pull_request:
    paths:
      - 'public/theme-system/**'
      - 'public/index.html'
      - 'public/sortear-nomes/index.html'
      - 'public/sortear-numeros/index.html'
      - 'public/sortear-equipes/index.html'
      - 'public/roleta-online/index.html'
      - 'public/sorteio-rifa-online/index.html'
      - 'public/cara-ou-coroa-online/index.html'
      - 'public/sortear-aluno-online/index.html'
      - 'public/dividir-turma-em-grupos/index.html'
      - 'tests/theme-redesign-contract.test.mjs'
      - '.github/workflows/theme-redesign.yml'
      - 'scripts/capture-theme-review.mjs'
  push:
    branches: [main]
    paths:
      - 'public/theme-system/**'
      - 'tests/theme-redesign-contract.test.mjs'
      - '.github/workflows/theme-redesign.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check public/theme-system/themes.mjs
          node --check public/theme-system/seo-shell.mjs
          node --check public/theme-system/home.mjs
          node --check scripts/capture-theme-review.mjs
      - name: Verify redesign contracts
        run: node --test tests/theme-redesign-contract.test.mjs
      - name: Install browser dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Capture homepage and SEO pages in seven themes
        run: |
          python3 -m http.server 8765 --directory public > /tmp/su-static-server.log 2>&1 &
          node scripts/capture-theme-review.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-review-seven-themes
          path: artifacts/theme-review/
          if-no-files-found: warn
          retention-days: 7
