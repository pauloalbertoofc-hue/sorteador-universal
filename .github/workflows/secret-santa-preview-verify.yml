name: Secret Santa preview D1 schema verification (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview-d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact preview target
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.preview-db.jsonc','utf8'));
          const db=config.d1_databases;
          if(db.length!==1||db[0].database_name!=='sorteador-universal-preview-db'||db[0].database_id!=='9701cfcf-9c77-4b09-8411-0f4a13f8c584'||db[0].migrations_dir!=='migrations/preview')throw Error('Refusing unexpected D1 target');
          if(JSON.stringify(config).includes('24fe67dc-7003-4557-9de0-cf6658e713c2'))throw Error('Production target must not appear');
          NODE
      - name: Verify private Secret Santa schema and migration (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute DB --remote --config wrangler.preview-db.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('secret_santa_events','secret_santa_participants') ORDER BY name;" --json > tables.json
          npx wrangler d1 execute DB --remote --config wrangler.preview-db.jsonc --command "SELECT name FROM d1_migrations WHERE name='0007_secret_santa_private_storage.sql';" --json > history.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const rows=file=>JSON.parse(readFileSync(file,'utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          if(JSON.stringify(rows('tables.json'))!==JSON.stringify(['secret_santa_events','secret_santa_participants']))throw Error('Missing Secret Santa preview tables');
          if(!rows('history.json').includes('0007_secret_santa_private_storage.sql'))throw Error('Secret Santa migration not recorded in preview');
          console.log('Secret Santa preview D1 schema and migration verified (metadata only).');
          NODE
