name: Production rooms migration (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type MIGRAR-SALAS-PRODUCAO only after independently verifying a recoverable D1 backup'
        required: true
        type: string
      recovery_verified:
        description: 'Confirm a recoverable production backup and restoration procedure were independently verified'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sorteador-universal-production-rooms-migration
  cancel-in-progress: false

jobs:
  migrate-rooms:
    if: ${{ inputs.confirmation == 'MIGRAR-SALAS-PRODUCAO' && inputs.recovery_verified == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Validate additive migrations and exact production D1 target
        run: node scripts/verify-production-room-migration.mjs
      - name: Confirm existing migration history and no partial room schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM d1_migrations ORDER BY id;" --json > history.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('draw_rooms','draw_room_entries','draw_room_rate_limits') ORDER BY name;" --json > rooms.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const rows=file=>JSON.parse(readFileSync(file,'utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          const history=rows('history.json'), rooms=rows('rooms.json');
          if(JSON.stringify(history)!==JSON.stringify(['0001_sessions.sql','0002_billing_safety.sql']))throw Error('Unexpected migration history; manual investigation required');
          if(rooms.length!==0)throw Error('Room tables already present or partial; refuse migration');
          console.log('Pre-migration metadata verified. No user data read.');
          NODE
      - name: Apply only additive production room migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Verify all room tables and migration records (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('draw_rooms','draw_room_entries','draw_room_rate_limits') ORDER BY name;" --json > rooms-after.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM d1_migrations ORDER BY id;" --json > history-after.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const rows=file=>JSON.parse(readFileSync(file,'utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          const expected=['draw_room_entries','draw_room_rate_limits','draw_rooms'];
          if(JSON.stringify(rows('rooms-after.json'))!==JSON.stringify(expected))throw Error('Room schema verification failed; STOP and investigate, do not deploy');
          const history=rows('history-after.json');
          if(JSON.stringify(history)!==JSON.stringify(['0001_sessions.sql','0002_billing_safety.sql','0003_public_rooms.sql','0004_room_rate_limits.sql']))throw Error('Migration history verification failed; STOP and investigate, do not deploy');
          console.log('Production room schema verified. Deployment is a separate, explicitly approved action.');
          NODE
