name: Diagnose production D1 Secret Santa (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sorteador-universal-production-d1-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Inspect production D1 schema and migration history (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('secret_santa_events','secret_santa_participants') ORDER BY name;" --json > santa-tables.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations';" --json > migration-table.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const rows = file => JSON.parse(readFileSync(file,'utf8')).flatMap(item => item.results || []).map(item => item.name);
          const found = rows('santa-tables.json');
          const required = ['secret_santa_events','secret_santa_participants'];
          console.log('Secret Santa tables present: ' + (found.join(', ') || '(none)'));
          console.log('Missing tables: ' + (required.filter(name => !found.includes(name)).join(', ') || '(none)'));
          console.log('D1 migration history table exists: ' + rows('migration-table.json').includes('d1_migrations'));
          NODE
          if node --input-type=module -e "import fs from 'node:fs'; process.exit(JSON.parse(fs.readFileSync('migration-table.json','utf8')).flatMap(x=>x.results||[]).some(x=>x.name==='d1_migrations')?0:1)"; then
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM d1_migrations WHERE name IN ('0003_public_rooms.sql','0004_room_rate_limits.sql','0005_room_live_draw.sql','0006_room_draw_mode.sql','0007_secret_santa_private_storage.sql') ORDER BY name;" --json > migration-history.json
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const names=JSON.parse(readFileSync('migration-history.json','utf8')).flatMap(x=>x.results||[]).map(x=>x.name);
          for(const name of ['0003_public_rooms.sql','0004_room_rate_limits.sql','0005_room_live_draw.sql','0006_room_draw_mode.sql','0007_secret_santa_private_storage.sql']) console.log(name + ': ' + (names.includes(name) ? 'recorded' : 'NOT recorded'));
          NODE
          else
            echo "No d1_migrations table; migration history cannot be checked."
          fi
          echo "Read-only diagnostic finished. No migration or deployment performed."
