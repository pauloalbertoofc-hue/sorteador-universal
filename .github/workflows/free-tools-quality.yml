name: Free tools quality checks

on:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'public/index.html'
      - 'public/google*.html'
      - 'public/sw.js'
      - 'tests/free-tools-ui.test.mjs'
      - 'tests/free-tools-browser.test.mjs'
      - 'tests/rooms-api-contract.test.mjs'
      - 'tests/rooms-integration.test.mjs'
      - 'tests/rooms-multiclient-browser.test.mjs'
      - 'tests/preview.test.mjs'
      - '.github/workflows/preview-d1-homologation.yml'
      - 'migrations/preview/0003_public_rooms.sql'
      - 'migrations/preview/0004_room_rate_limits.sql'
      - 'migrations/preview/0005_room_live_draw.sql'
      - 'migrations/preview/0006_room_draw_mode.sql'
      - 'src/worker.js'
      - 'migrations/0003_public_rooms.sql'
      - 'migrations/0004_room_rate_limits.sql'
      - 'migrations/0005_room_live_draw.sql'
      - 'migrations/0006_room_draw_mode.sql'
      - 'wrangler.jsonc'
      - 'wrangler.rooms-preview.jsonc'
      - '.github/workflows/rooms-preview-http.yml'
      - '.github/workflows/free-tools-quality.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'public/index.html'
      - 'public/google*.html'
      - 'public/sw.js'
      - 'tests/free-tools-ui.test.mjs'
      - 'tests/free-tools-browser.test.mjs'
      - 'tests/rooms-api-contract.test.mjs'
      - 'tests/rooms-integration.test.mjs'
      - 'tests/rooms-multiclient-browser.test.mjs'
      - 'tests/preview.test.mjs'
      - '.github/workflows/preview-d1-homologation.yml'
      - 'migrations/preview/0003_public_rooms.sql'
      - 'migrations/preview/0004_room_rate_limits.sql'
      - 'migrations/preview/0005_room_live_draw.sql'
      - 'migrations/preview/0006_room_draw_mode.sql'
      - 'src/worker.js'
      - 'migrations/0003_public_rooms.sql'
      - 'migrations/0004_room_rate_limits.sql'
      - 'migrations/0005_room_live_draw.sql'
      - 'migrations/0006_room_draw_mode.sql'
      - 'wrangler.jsonc'
      - 'wrangler.rooms-preview.jsonc'
      - '.github/workflows/rooms-preview-http.yml'
      - '.github/workflows/free-tools-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Static and algorithm checks
        run: |
          node --check src/worker.js
          node --test tests/free-tools-ui.test.mjs tests/rooms-api-contract.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Node integration tests (Chromium available)
        run: |
          npm run check
          node --test --test-concurrency=1 tests/auth.test.mjs tests/billing-checkout-validation.test.mjs tests/billing-pilot.test.mjs tests/billing.test.mjs tests/free-tools-ui.test.mjs tests/hosted-claim.test.mjs tests/hosted-plan-checkout.test.mjs tests/mp-admin-transport.test.mjs tests/mp-plan-admin.test.mjs tests/mp-planless-response.test.mjs tests/mp-subscription-contract.test.mjs tests/preview.test.mjs tests/rooms-api-contract.test.mjs tests/rooms-integration.test.mjs tests/webhook-hmac-simulator.test.mjs
      - name: Mobile browser smoke tests
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/free-tools-browser.test.mjs tests/rooms-multiclient-browser.test.mjs 2>&1 | tee free-tools-browser.log
      - name: Upload mobile layout screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-320-390
          path: |
            mobile-320.png
            mobile-390.png
            mobile-320-*.png
            mobile-390-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish browser test summary
        if: always()
        run: |
          {
            echo "## Sorteador Universal — browser checks"
            if [ -f free-tools-browser.log ]; then
              echo '~~~text'
              tail -n 90 free-tools-browser.log
              echo '~~~'
            else
              echo "Browser tests did not start. Check the preceding workflow steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser test log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: free-tools-browser-test-log
          path: free-tools-browser.log
          if-no-files-found: ignore
          retention-days: 7
